name: harness
services:
  harness:
    build: { context: .., dockerfile: docker/Dockerfile.harness }
    # Loopback only: the API is unauthenticated (threat model F1), so it must not be reachable from
    # off the workstation. Binding to 127.0.0.1 keeps `curl localhost:8080` working while other
    # hosts on the network cannot trigger runs. Real auth arrives before this opens up.
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Which repo a run targets now comes from the request, checked against RepoAllowlist
      # (appsettings) — M3 retired the single startup GitHub__Owner/__Repo binding.
    volumes:
      - ../workflows:/app/workflows:ro
      - ../prompts:/app/prompts:ro
      - ../schemas:/app/schemas:ro
      # M7 org policy floor: the ceiling every workflow is validated against at load time. Read-only,
      # same as the other declarative inputs — operator-owned, changed by reviewed PR.
      - ../policy.yaml:/app/policy.yaml:ro
      # M7b named agent registry: agents/<name>.yaml (+ teams/<team>/ overrides), resolved via agent_ref.
      - ../agents:/app/agents:ro
      - audit-payloads:/data/audit-payloads
      - worktrees:/data/worktrees
    # service_started is not enough for postgres: EnsureCreated() runs at boot with no retry, so
    # the API loses the race against postgres init and dies on "connection refused".
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy

  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    # Not published to the host: the harness reaches it as gateway:4000 over the compose network,
    # and `docker compose exec gateway ...` covers debugging. Publishing it put the only spend-
    # metered service on 0.0.0.0 behind a single master key (threat model F6). The container
    # healthcheck below, not a host probe, is what gates startup.
    expose: ["4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY} # the ONLY service that sees the key
      LITELLM_MASTER_KEY: ${GATEWAY_MASTER_KEY}
    volumes:
      - ./gateway-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Same race as postgres had: on a cold start the gateway takes ~20s to listen, and the first
    # agent node fails with "Connection refused (gateway:4000)". The image ships neither curl nor
    # wget, so the probe goes through its own python.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
  audit-payloads:
  worktrees:
