name: test-generation
description: >-
  Generate missing unit tests for code in a PR or path, prove they compile and pass in the
  sandbox, then open a human-gated PR carrying them. Read-heavy up front; the only externally
  visible writes are a pushed branch and an opened PR, both behind a human gate. Never merges.
# Write intent: this ceiling is what makes the engine spin up a runner sandbox for the run.
permissions:
  repo: write-worktree
  github: open_pr+issues
nodes:
  # 1. Understand the code under test and decide what is worth covering. Read-only tools.
  - id: gather
    kind: agent
    prompt_ref: test-generation/gather.md
    tools: [github.pr_diff, repo.read, repo.list, codesearch.query]
    output_schema: schemas/test-plan.json

  # 2. Write the tests into the worktree and iterate until `dotnet test` passes (fail-closed:
  #    if the suite never goes green within max_iterations, the node fails and nothing is pushed).
  - id: author-tests
    kind: agent-loop
    depends_on: [gather]
    prompt_ref: test-generation/author-tests.md
    tools: [repo.read, repo.list, codesearch.query, repo.write_worktree]
    until: validation_pass
    run: "dotnet test"
    max_iterations: 5
    fresh_context: true

  # 3. HARD human gate. Nothing externally visible has happened yet; the initiator approves here.
  - id: approve
    kind: gate
    depends_on: [author-tests]
    gate: human
    approvers: [initiator]

  # 4. Push the branch and open the PR. The workflow ENDS here — there is no merge step.
  - id: open-pr
    kind: agent
    depends_on: [approve]
    prompt_ref: test-generation/open-pr.md
    tools: [github.push_branch, github.open_pr]
