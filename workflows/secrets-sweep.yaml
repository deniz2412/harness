name: secrets-sweep
description: >-
  Scan the run's own worktree for committed secrets with a pinned gitleaks binary, then triage the
  findings and post ONE PR review comment. Deterministic tool finds; the agent explains and
  recommends remediation. The only externally visible write is the comment (auto-gated by the
  policy scan) — no branch, no PR, no merge. A scan that cannot run FAILS the node; it never
  reports "clean" on error. Findings are referenced by rule id + file:line, never by secret value.
# Write intent: `repo: write-worktree` is what makes the engine spin up the runner sandbox so the
# pinned gitleaks binary has a worktree to scan. The only external write is the comment, so the
# github ceiling stops at `comment` — this workflow can never open a PR or push a branch.
permissions:
  repo: write-worktree
  github: comment
nodes:
  # 1. Deterministic scan. gitleaks scans the working tree (--no-git) and writes a JSON report.
  #    --exit-code 0 makes gitleaks ALWAYS exit 0 so the bash node succeeds whether or not leaks
  #    are found — a finding is data to triage, not a node failure. If gitleaks itself cannot run
  #    (binary missing, worktree unreadable) it exits non-zero and the node fails: fail-closed, we
  #    never proceed to report "clean" on a scan that did not actually happen. One command, no
  #    shell operators — the sandbox tokenises argv directly.
  - id: scan
    kind: bash
    run: gitleaks detect --source . --no-git --report-format json --report-path gitleaks-report.json --exit-code 0

  # 2. Triage + report. Read the JSON report the scan wrote (repo.read is scoped to the run's
  #    worktree) and the scan summary, explain each finding, and post ONE PR comment. If the report
  #    is empty this is a legitimate clean result — say so briefly. The comment references findings
  #    by rule id + file:line ONLY; the prompt forbids echoing recovered secret values.
  - id: report
    kind: agent
    depends_on: [scan]
    gate: auto            # low-risk write (comment) — auto-gated via the policy scan
    prompt_ref: secrets-sweep/report.md
    tools: [repo.read, repo.list, github.pr_comment]
