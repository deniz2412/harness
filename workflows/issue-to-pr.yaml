name: issue-to-pr
description: >-
  Take a GitHub issue, implement a fix in an isolated worktree, prove it with the test suite,
  then open a human-gated PR that references the issue. The only externally visible writes are a
  pushed branch and an opened PR, both behind a human gate. Ends at the PR; never merges the issue.
# Write intent: this ceiling is what makes the engine spin up a runner sandbox for the run.
permissions:
  repo: write-worktree
  github: open_pr+issues
nodes:
  # 1. Read the issue and the surrounding code, produce a plan. Read-only tools.
  - id: plan
    kind: agent
    prompt_ref: issue-to-pr/plan.md
    tools: [github.get_issue, repo.read, repo.list, codesearch.query]

  # 2. Implement the fix in the worktree and iterate until `dotnet test` passes (fail-closed:
  #    if the suite never goes green within max_iterations, the node fails and nothing is pushed).
  - id: implement
    kind: agent-loop
    depends_on: [plan]
    prompt_ref: issue-to-pr/implement.md
    tools: [repo.read, repo.list, codesearch.query, repo.write_worktree]
    until: validation_pass
    run: "dotnet test"
    max_iterations: 5
    fresh_context: true

  # 3. HARD human gate. Nothing externally visible has happened yet; the initiator approves here.
  - id: approve
    kind: gate
    depends_on: [implement]
    gate: human
    approvers: [initiator]

  # 4. Push the branch and open the PR (body references the issue with "Closes #N"). The workflow
  #    ENDS here — opening the PR is the terminal act; there is no merge step.
  - id: open-pr
    kind: agent
    depends_on: [approve]
    prompt_ref: issue-to-pr/open-pr.md
    tools: [github.push_branch, github.open_pr]
