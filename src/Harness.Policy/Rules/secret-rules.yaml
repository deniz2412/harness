# Harness secret ruleset (gitleaks-style). Data, not code — see Harness.Policy/SecretScanner.cs.
#
# Rule fields:
#   id            required, unique, kebab-case. Appears in policy_block audit events.
#   description   required, human-readable. Appears in the block reason.
#   regex         required, .NET syntax, single line. Inline flags only ((?i), (?m)); no rule may
#                 rely on rule-set-wide options. Every match runs under a match timeout.
#   secret_group  optional capture group holding the secret itself (default 0 = whole match).
#                 Entropy, redaction and the fingerprint are all computed over this group, so a
#                 keyword-anchored rule redacts the value without redacting the keyword.
#   entropy       optional Shannon entropy floor (bits/char) over secret_group. Below it, no match.
#   allowlist     optional regexes evaluated against secret_group; any hit is a false positive.
#
# NEVER put a real credential in this file, in a test, or in a fixture. Positives are synthetic.
version: 1
rules:

  - id: anthropic-api-key
    description: Anthropic API key
    regex: |-
      sk-ant-[A-Za-z0-9_\-]{24,}

  - id: github-token
    description: GitHub token (classic PAT / OAuth / user / server / refresh)
    regex: |-
      gh[pousr]_[A-Za-z0-9]{36,255}

  - id: github-pat-fine-grained
    description: GitHub fine-grained personal access token
    regex: |-
      github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59,}

  - id: github-app-installation-token
    description: GitHub App installation access token
    regex: |-
      (?:v1\.)[a-f0-9]{40}

  - id: aws-access-key-id
    description: AWS access key ID
    regex: |-
      (?:A3T[A-Z0-9]|AKIA|ABIA|ACCA|ASIA)[A-Z0-9]{16}

  - id: aws-secret-access-key
    description: AWS secret access key
    regex: |-
      (?i)aws_?(?:secret_?)?access_?key["'\s]{0,5}[:=]{1,2}>?["'\s]{0,5}([A-Za-z0-9/+=]{40})
    secret_group: 1
    entropy: 3.0
    allowlist:
      - |-
        (?i)(?:example|placeholder|redacted|xxxx)

  - id: private-key
    description: Private key block (RSA / DSA / EC / OPENSSH / PGP / encrypted)
    regex: |-
      -----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----

  - id: slack-token
    description: Slack token (bot / app / user / legacy)
    regex: |-
      xox[baprse]-[0-9A-Za-z\-]{10,64}

  - id: slack-webhook-url
    description: Slack incoming webhook URL
    regex: |-
      https://hooks\.slack\.com/services/T[A-Za-z0-9_]{6,}/B[A-Za-z0-9_]{6,}/[A-Za-z0-9_]{20,}

  - id: google-api-key
    description: Google API key
    regex: |-
      AIza[0-9A-Za-z_\-]{35}

  - id: azure-storage-connection-string
    description: Azure storage connection string (AccountKey)
    regex: |-
      (?i)DefaultEndpointsProtocol=https?;[^\n]{0,200}AccountKey=([A-Za-z0-9+/=]{40,})
    secret_group: 1

  - id: azure-ad-client-secret
    description: Azure AD / Entra application client secret
    regex: |-
      [A-Za-z0-9_~.]{3}[0-9]Q~[A-Za-z0-9_~.\-]{31,34}

  - id: json-web-token
    description: JSON Web Token
    regex: |-
      eyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}

  # Catch-all for `api_key = "..."` shapes. Gated on Shannon entropy so it does not fire on every
  # string literal in a diff, and on a placeholder allowlist so docs and templates stay quiet.
  - id: generic-high-entropy-assignment
    description: High-entropy value assigned to a credential-shaped name
    regex: |-
      (?i)\b(?:api[_\-]?key|secret[_\-]?key|client[_\-]?secret|auth[_\-]?token|access[_\-]?token|password|passwd|pwd|credential|secret)\b["'` ]{0,3}[:=]{1,2}>?[ ]{0,4}["'`]([^"'`\s]{12,120})["'`]
    secret_group: 1
    entropy: 3.5
    allowlist:
      - |-
        (?i)^(?:x{3,}|\*{3,}|\.{3,}|<[^>]*>|\$\{[^}]*\}|\{\{[^}]*\}\}|%[A-Za-z0-9_]+%|\$[A-Z_]{3,})$
      - |-
        (?i)(?:example|changeme|placeholder|redacted|your[_\-]?|dummy|sample|fake|notreal|todo|xxxx)
      - |-
        (?i)^(?:process\.env|os\.environ|env\[|getenv|System\.getenv)
